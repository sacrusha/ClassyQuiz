# The state Worker: hosts the Durable Objects the site's functions bind to.
name = "classyquiz-state"
main = "worker.ts"
compatibility_date = "2026-10-01"
workers_dev = false
preview_urls = false

[[durable_objects.bindings]]
name = "INSTANCE"
class_name = "Instance"

[[durable_objects.bindings]]
name = "JOIN"
class_name = "JoinCode"

[[durable_objects.bindings]]
name = "STATS"
class_name = "UploadStats"

[[durable_objects.bindings]]
name = "BUDGET"
class_name = "SiteBudget"

# The Free plan only offers SQLite-backed Durable Objects.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Instance", "JoinCode", "Pairing"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["UploadStats"]

[[migrations]]
tag = "v3"
deleted_classes = ["Pairing"]

# The site's share of the free plan: uploads a day, bytes stored (docs/design/hosting-and-limits.md, "Protecting the day's allowance").
[[migrations]]
tag = "v4"
new_sqlite_classes = ["SiteBudget"]

# No request logs: they would hold IP addresses (docs/design/hosting-and-limits.md, "What lives, and for how long").
[observability]
enabled = false
